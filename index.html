<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Money</title>
<meta name="theme-color" content="#08080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Island Money">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cfstamyhaocixxubrdqr.supabase.co" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="island.css?v=4">
<link rel="stylesheet" href="web.css?v=9">
<link rel="modulepreload" href="bloub/view.js">
<link rel="modulepreload" href="bloub/decor.js">
<link rel="modulepreload" href="bloub/engine.js">
<link rel="modulepreload" href="bloub/expressions.js">
<link rel="modulepreload" href="bloub/eyefit.js">
<link rel="modulepreload" href="bloub/face.js">
<link rel="modulepreload" href="bloub/gaze.js">
<link rel="modulepreload" href="bloub/math.js">
<link rel="modulepreload" href="bloub/profiles.js">
<link rel="modulepreload" href="bloub/repere.js">
<link rel="modulepreload" href="bloub/shape.js">
<link rel="modulepreload" href="bloub/skins.js">
<link rel="modulepreload" href="bloub/states.js">
</head>
<body class="loading">
<!-- The island's own look, copied from ../ui: its tokens (island.css, theme.js), icons, blob (bloub/) and notched cards (notch.js).
     On a phone this is the whole screen, with the tabs at the bottom like an app; on a computer it is the island panel in the middle of the page. -->
<div id="pill" class="open">
  <div id="content">
    <header id="appbar"><b>Island Money</b></header>
    <!-- pull down from the upper half of the screen to reload the balance -->
    <div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div>

    <main id="views">
      <!-- the balance: the island's Money card; click the amount to change it -->
      <section class="view on" id="v-money">
        <div class="bar top"><span class="label">Balance</span><span id="mTag"></span></div>
        <div id="mBal" class="notch">
          <i data-ic="wallet"></i>
          <div id="mBlob"></div>
          <div class="mi">
            <span class="k">Balance</span>
            <b id="mBalance" class="sk" tabindex="0" role="button" title="Click to change">€0,000</b>
            <input id="mEdit" class="medit" type="text" inputmode="decimal" maxlength="16" aria-label="Balance" hidden>
            <small id="mIO" class="sk">Loading your balance</small>
          </div>
        </div>
        <div id="mChart" class="notch">
          <i data-ic="trend"></i>
          <div class="ch"><span class="k">Last 30 days</span><span id="mbNote" class="sk"></span></div>
          <div class="chartbox">
            <svg id="mbChart" role="img" aria-label="Balance over the last 30 days">
              <defs>
                <linearGradient id="mbgLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient>
                <linearGradient id="mbgArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
              </defs>
              <path id="mbArea" fill="url(#mbgArea)"/>
              <path id="mbLine" fill="none" stroke="url(#mbgLine)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <line id="mbCross" y1="2" y2="58"/>
              <circle id="mbHalo" r="8"/>
              <circle id="mbDot" r="3.8"/>
            </svg>
            <div class="chartsk"></div>
          </div>
        </div>
      </section>

      <!-- settings, as in the island: the account (sign in with an emailed code), then how it looks -->
      <section class="view" id="v-settings">
        <div class="group">
          <span class="label">Account</span>
          <div class="setrow">
            <i class="av" id="accAv" hidden></i>
            <span id="accText">Not signed in</span>
            <button class="pillbtn" id="accBtn" type="button">Sign in</button>
          </div>
          <form class="accform" id="accForm" hidden autocomplete="on">
            <input class="field" id="accIn" spellcheck="false" aria-label="Email or code">
            <button class="pillbtn primary" id="accGo" type="submit">Send code</button>
          </form>
        </div>
        <div class="group">
          <span class="label">Appearance</span>
          <div class="setrow"><span>Theme</span><div class="seg" id="setTheme"><button data-v="dark" type="button">Dark</button><button data-v="light" type="button">Light</button><button data-v="auto" type="button">Auto</button></div></div>
          <div class="setrow"><span>Palette</span><div class="swatches" id="setPalette"></div></div>
        </div>
        <div class="group" id="appGroup" hidden>
          <span class="label">App</span>
          <div class="setrow"><span>Add to your home screen<small id="appSmall">Opens full screen, like an app</small></span><button class="pillbtn primary" id="appBtn" type="button">Install</button></div>
        </div>
        <div class="bar foot"><span>Island Money 0.1</span></div>
      </section>
    </main>

    <nav id="dock" aria-label="Tabs">
      <span id="dockInd"></span>
      <button type="button" data-t="money" class="on"><i data-ic="wallet"></i><span>Money</span></button>
      <button type="button" data-t="settings"><i data-ic="gear"></i><span>Settings</span></button>
    </nav>
  </div>
</div>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<script defer src="icons.js"></script>
<script defer src="notch.js?v=4"></script>
<script defer src="app.js?v=6"></script>
</body>
</html>
