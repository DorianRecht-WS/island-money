<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Island Money</title>
<style>
  :root { --bg: #eef0f6; --text: #151a26; --soft: #5b6580; }
  @media (prefers-color-scheme: dark) { :root { --bg: #08080d; --text: #eceef4; --soft: #7b8094; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; display: grid; place-items: center; text-align: center; }
  main { padding: 24px; }
  b { display: block; font-size: 20px; letter-spacing: -.01em; margin-bottom: 6px; }
  a { color: var(--soft); text-decoration: none; margin: 0 8px; font-size: 13px; }
  p { margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <b>Island Money</b>
  <span style="color: var(--soft)">The app lives on your phone.</span>
  <p><a id="open" href="#">Open the app</a> <a href="https://github.com/DorianRecht-WS/island-money-app/releases/latest">Get the Android app</a></p>
  <p><a href="privacy.html">Privacy</a> <a href="terms.html">Terms</a></p>
</main>
<script>
  // On Android this page only hands over to the app: the bank sends you back here (?bank=ok), and the page opens the app on its own.
  // Without the app installed, the phone goes to the releases page to download it.
  const q = new URLSearchParams(location.search), bank = q.get('bank');
  const store = 'https://github.com/DorianRecht-WS/island-money-app/releases/latest';
  const link = (path) => `intent://${path}#Intent;scheme=moneyisland;package=studio.inspyr.moneyisland;S.browser_fallback_url=${encodeURIComponent(store)};end`;
  if (/android/i.test(navigator.userAgent)) {
    const to = link(bank ? `bank?result=${encodeURIComponent(bank)}` : 'open');
    document.getElementById('open').href = to;
    if (bank) location.replace(to);   // only coming back from the bank opens it by itself; a plain visit shows the page
  } else document.getElementById('open').hidden = true;
</script>
</body>
</html>
